schema_version: 1
workflows:
  - id: design.image
    version: "1"
    description: Generate a design image with the image provider, validate the file, publish it to the channel.
    input_schema:
      type: object
      required: [prompt, width, height, transparent]
      properties:
        prompt: {type: string, minLength: 3}
        width: {type: integer, minimum: 16, maximum: 3840}
        height: {type: integer, minimum: 16, maximum: 3840}
        transparent: {type: boolean}
    steps:
      - id: generate
        executor: capability
        ref: design.image_generate
        agent: designer
        inputs: {prompt: $input.prompt, width: $input.width, height: $input.height, transparent: $input.transparent}
      - id: validate
        executor: validator
        ref: media.image_valid
        depends_on: [generate]
        inputs:
          images: [$steps.generate.output]
          rules: {width: $input.width, height: $input.height, require_alpha: $input.transparent}
    success_criteria:
      - {kind: artifact_exists, step: generate}
      - {kind: gate_passed, step: validate}
    outputs: {image: $steps.generate.output}
  - id: design.model3d
    version: "1"
    description: Generate a 3D model with the 3D provider (Meshy) from text or a reference image; the operator reviews its preview.
    input_schema:
      type: object
      required: [prompt]
      properties:
        prompt: {type: string, minLength: 3, maxLength: 800}
        image_ref: {type: string}
        texture: {type: boolean}
        format: {type: string, enum: [glb, fbx, obj, usdz, stl]}
    steps:
      - id: generate
        executor: capability
        ref: design.model3d_generate
        agent: designer
        inputs: {prompt: $input.prompt, image_ref: $input.image_ref, texture: $input.texture, format: $input.format}
    success_criteria:
      - {kind: artifact_exists, step: generate}
    outputs: {model: $steps.generate.output}
