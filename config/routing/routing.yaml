schema_version: 1
routing:
  default_workflow: general.answer
  plugin_fallback: true          # Phase 3-5 plugin classifier when no route matches
  dynamic_planning: {enabled: false}
  routes:
    - {id: unity-ui, task_type: unity_ui, workflow: unity.ui_task, priority: 10}
    - {id: code-change, task_type: code_change, workflow: code.implement_and_test, priority: 15}
    - {id: design-image, task_type: design_image, workflow: design.image, priority: 16}
    - {id: research, task_type: research_report, workflow: research.document_report, priority: 20}
    - {id: write-file, task_type: write_file, workflow: files.write_with_approval, priority: 30}
  feedback_routes:
    - id: visual
      workflow: visual_feedback
      priority: 10
      requires_report_images: true
      keywords: [layout, design, redesign, ui, spacing, alignment, position, gemini]
    - id: acknowledge
      workflow: feedback.acknowledge
      priority: 100
