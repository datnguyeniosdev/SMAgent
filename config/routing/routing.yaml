schema_version: 1
routing:
  # Live-session work of projects in routing_mode central (/route p# central): the first rule
  # whose project glob and regex match the request names its lane; the gateway hands it to that
  # lane's child itself. No match: the shared Gateway Agent reads it and calls dispatch.
  #   - {project: "*", match: "(?i)^\\s*\\[qa\\]", lane: qa}   # "[qa] retest level 3"
  channel_rules: []
  # Worker roles the Gateway Agent assigns with dispatch(role=...): the prompt and the skills go with
  # the request and the skills are enforced (own skill, shared, or <project>/<skill>).
  roles:
    uiux:
      description: UI/UX design, review and redesign of screens and flows
      skills: [UIUXAgent/uiux-art-director]
      prompt: You are the UI/UX art director for this request; follow uiux-art-director's workflow.
    art:
      description: game art, icons, sprites, backgrounds, effects and sounds
      skills: [game-asset-forge, UIUXAgent/game-art-direction]
      prompt: You make original game assets for this request; follow the art direction and the forge pipeline.
    qa:
      description: testing a build, feature, release candidate, regression, IP or asset check
      skills: [QAIPAgent/qa-agent]
      prompt: You are the QA worker for this request; follow qa-agent.
    po:
      description: product decisions, idea validation, market or competitor research, roadmap, backlog
      skills: [PO Game Agent/po-agent]
      prompt: You are the game product owner for this request; follow po-agent.
    gamedev:
      description: code work on a product (features, fixes, refactors, tuning, integration)
      skills: [game-dev]
      prompt: You are the developer on this product's dev lane; follow game-dev.
  # Mandatory rules by request text, any project: added to the request; require_command makes the
  # PreToolUse hook block edits and other commands until the session has run it for that request.
  task_rules:
    - match: '(?i)dịch ngược|reverse[- ]?engineer|decompil|disassembl|\bapk\b|\bipa\b|\.dex\b|smali|jadx|ghidra|frida'
      rule: >-
        Reverse engineering: always use rea first (https://github.com/morluto/rea, installed on this
        Mac as `rea`): start with `rea capabilities` and `rea analyze <target>`, and use other tools
        only for what rea cannot do, saying why in your answer.
      require_command: rea
  default_workflow: general.answer
  plugin_fallback: true          # Phase 3-5 plugin classifier when no route matches
  dynamic_planning: {enabled: false}
  routes:
    - {id: unity-ui, task_type: unity_ui, workflow: unity.ui_task, priority: 10}
    - {id: code-change, task_type: code_change, workflow: code.implement_and_test, priority: 15}
    - {id: design-image, task_type: design_image, workflow: design.image, priority: 16}
    - {id: design-model3d, task_type: design_model3d, workflow: design.model3d, priority: 16}
    - {id: research, task_type: research_report, workflow: research.document_report, priority: 20}
    - {id: write-file, task_type: write_file, workflow: files.write_with_approval, priority: 30}
  feedback_routes:
    - id: visual
      workflow: visual_feedback
      priority: 10
      requires_report_images: true
      keywords: [layout, design, redesign, ui, spacing, alignment, position, gemini]
    - id: acknowledge
      workflow: feedback.acknowledge
      priority: 100
